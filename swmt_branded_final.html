<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoe Wedge Mafia Tour</title>
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWMT">
<style>
/* ── DESIGN TOKENS — Dark Mafia Theme ── */
:root{
  --bg-primary:#0D0D0D;
  --bg-secondary:#161616;
  --bg-card:#1C1C1C;
  --bg-hover:#242424;
  --border:#2E2E2E;
  --border-light:#3A3A3A;
  --text-primary:#F0EDE8;
  --text-secondary:#888880;
  --text-muted:#555550;
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --gold-dark:#A07830;
  --gold-bg:#1E1A0E;
  --red:#CC3333;
  --red-bg:#1A0808;
  --green:#2D7A4A;
  --green-light:#3D9A5A;
  --green-bg:#0A1810;
  --blue:#2A5080;
  --blue-light:#3A6090;
  --silver:#9A9890;
  --silver-bg:#1A1A18;
  --shadow:0 4px 24px rgba(0,0,0,.7);
  --shadow-sm:0 2px 8px rgba(0,0,0,.5);
  --radius:8px;
  --radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);font-size:14px;min-height:100vh}
.page{display:none}.page.active{display:block}
.app{padding:1rem 1rem 3rem}

/* ── TOPBAR ── */
.topbar{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{height:44px;width:44px;object-fit:contain;filter:invert(1);mix-blend-mode:screen}
.topbar-title{display:flex;flex-direction:column}
.topbar-name{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);line-height:1.1}
.topbar-sub{font-size:10px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase}
.topbar-right{display:flex;gap:6px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{padding:6px 14px;font-size:12px;font-weight:500;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;letter-spacing:.03em;transition:all .15s}
.btn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--silver)}
.btn-gold{background:var(--gold-dark);color:var(--gold-light);border-color:var(--gold);font-weight:600}
.btn-gold:hover{background:var(--gold);color:#0D0D0D}
.btn-red{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.btn-red:hover{background:var(--red);color:#fff}
.btn-green{background:var(--green-bg);color:var(--green-light);border-color:var(--green)}
.btn-green:hover{background:var(--green);color:#fff}
.btn-sm{padding:3px 8px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-muted);cursor:pointer}
.btn-sm:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-link{background:none;border:none;padding:0;font-size:12px;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:2px;letter-spacing:.02em}
.btn-link:hover{color:var(--gold-light)}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer;background:none;border:none;padding:0;margin-bottom:1.25rem;letter-spacing:.02em}
.back-btn:hover{color:var(--gold)}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-dark))}
.stat-card.click{cursor:pointer}.stat-card.click:hover{border-color:var(--gold);background:var(--gold-bg)}
.stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:600}
.stat-val{font-size:24px;font-weight:700;color:var(--text-primary);line-height:1}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.stat-sub.link{color:var(--gold);font-weight:500}

/* ── VIEW TABS ── */
.view-tabs{display:flex;gap:4px;margin-bottom:1.25rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
.vtab{padding:8px 16px;font-size:12px;font-weight:500;border:none;border-bottom:2px solid transparent;background:none;color:var(--text-muted);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;margin-bottom:-1px}
.vtab:hover{color:var(--text-primary)}
.vtab.active{color:var(--gold);border-bottom-color:var(--gold)}
.vtab.active-gold{color:var(--gold);border-bottom-color:var(--gold)}
.unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;margin-left:4px}

/* ── GAME TABS ── */
.game-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem}
.gtab{padding:4px 12px;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:20px;background:var(--bg-card);color:var(--text-muted);cursor:pointer;letter-spacing:.03em;transition:all .15s}
.gtab:hover{border-color:var(--silver);color:var(--text-primary)}
.gtab.active{background:var(--blue);color:#fff;border-color:var(--blue-light)}
.gtab.done{border-color:var(--green);color:var(--green-light)}
.gtab.active.done{background:var(--green);color:#fff;border-color:var(--green-light)}

/* ── TABLE ── */
.table-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.t-head{display:grid;padding:8px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
.t-head span{font-size:10px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.t-row{display:grid;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s}
.t-row:last-child{border-bottom:none}
.t-row:hover{background:var(--bg-hover)}
.pos-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.p1{background:linear-gradient(135deg,#8B6914,#C9A84C);color:#0D0D0D}
.p2{background:linear-gradient(135deg,#555,#999);color:#fff}
.p3{background:linear-gradient(135deg,#6B3A1F,#A0522D);color:#fff}
.pn{background:var(--bg-secondary);color:var(--text-muted);border:1px solid var(--border)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:10px}
.hcp-tag{font-size:10px;color:var(--text-muted);background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:1px 6px;margin-left:6px;flex-shrink:0;white-space:nowrap;letter-spacing:.02em}
.pts-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pts-high{background:var(--gold-bg);color:var(--gold-light);border:1px solid var(--gold-dark)}
.pts-mid{background:var(--silver-bg);color:var(--silver);border:1px solid var(--border-light)}
.pts-low{background:var(--bg-secondary);color:var(--text-muted);border:1px solid var(--border)}
.chip-done{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;background:var(--green-bg);border:1px solid var(--green);color:var(--green-light);margin-left:6px;letter-spacing:.03em}

/* ── RANK CHANGE ── */
.rank-chg{display:flex;flex-direction:column;align-items:center;justify-content:center;width:20px;flex-shrink:0}
.rank-up{color:var(--green-light);font-size:9px;font-weight:700}
.rank-dn{color:var(--red);font-size:9px;font-weight:700}
.rank-eq{color:var(--border-light);font-size:9px}
.rank-num{font-size:9px;margin-top:1px;font-weight:600}
.rank-num.up{color:var(--green-light)}.rank-num.dn{color:var(--red)}

/* ── POINTS TABLE ── */
.pts-table{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:6px}
.pts-row{display:grid;grid-template-columns:1fr 1fr;padding:5px 10px;border-bottom:1px solid var(--border);font-size:12px}
.pts-row:last-child{border-bottom:none}
.pts-row-hd{background:var(--bg-secondary);font-weight:700;color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}

/* ── MODAL ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:1rem;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.fg{margin-bottom:10px}
.fg label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg textarea,.fg select{width:100%;padding:7px 9px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--bg-secondary);color:var(--text-primary)}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.2)}
.fg textarea{resize:vertical;min-height:80px}
.row-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.empty{text-align:center;padding:2.5rem;color:var(--text-muted);font-size:13px}

/* ── HERO HEADER ── */
.hero{background:linear-gradient(180deg,#111 0%,var(--bg-secondary) 100%);border-bottom:1px solid var(--border);padding:1.5rem 1rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent)}
.hero-logo{height:80px;object-fit:contain;margin-bottom:.75rem;filter:drop-shadow(0 0 12px rgba(201,168,76,.3))}
.hero-title{font-size:20px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 20px rgba(201,168,76,.4)}
.hero-sub{font-size:11px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--green-light);background:var(--green-bg);border:1px solid var(--green);border-radius:8px;padding:2px 8px;margin-left:8px;letter-spacing:.04em}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--green-light);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── PROFILES ── */
.profiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-dark));opacity:0;transition:opacity .15s}
.pcard:hover{border-color:var(--gold-dark);background:var(--gold-bg)}.pcard:hover::before{opacity:1}
.pcard-top{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:12px}
.pcard-name{font-size:14px;font-weight:600;margin-bottom:4px;letter-spacing:.03em}
.pcard-hcp{font-size:11px;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-dark);border-radius:8px;padding:1px 8px;display:inline-block;font-weight:500}
.pcard-meta{font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px}
.pcard-meta-row{display:flex;justify-content:space-between}
.pcard-meta-val{color:var(--text-primary);font-weight:500}
.award-chip{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--gold-bg);color:var(--gold-light);border:1px solid var(--gold-dark);margin:2px 2px 0 0}

/* ── DETAIL ── */
.detail-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;max-width:480px;margin:0 auto;box-shadow:var(--shadow)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.detail-item{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.detail-item-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-weight:600}
.detail-item-val{font-size:15px;font-weight:600}
.season-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.sstat{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:8px;text-align:center}
.sstat-val{font-size:20px;font-weight:700}
.sstat-label{font-size:10px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

/* ── GSCARD ── */
.gscard-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.gscard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font-size:11px;color:var(--text-muted)}
.gscard strong{display:block;font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:1px}

/* ── BAND / BOARD ── */
.board-filter{display:flex;gap:5px;margin-bottom:1rem;flex-wrap:wrap}
.fchip{padding:4px 12px;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);color:var(--text-muted);cursor:pointer;letter-spacing:.03em;transition:all .15s}
.fchip:hover{border-color:var(--silver);color:var(--text-primary)}
.fchip.active{background:var(--blue);color:#fff;border-color:var(--blue-light)}
.post-list{display:flex;flex-direction:column;gap:10px}
.post-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;cursor:pointer;transition:all .15s}
.post-card:hover{border-color:var(--border-light);background:var(--bg-hover)}
.post-card.pinned{border-color:var(--gold-dark);background:var(--gold-bg)}
.post-card.unread{border-left:3px solid var(--red)}
.post-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post-cat{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;flex-shrink:0;letter-spacing:.04em;text-transform:uppercase}
.cat-notice{background:var(--gold-bg);color:var(--gold-light);border:1px solid var(--gold-dark)}
.cat-general{background:var(--bg-secondary);color:var(--silver);border:1px solid var(--border-light)}
.cat-game{background:var(--green-bg);color:var(--green-light);border:1px solid var(--green)}
.cat-photo{background:#1A1028;color:#9B80D4;border:1px solid #4A3080}
.pin-icon{font-size:10px;color:var(--gold);font-weight:700;background:var(--gold-bg);border:1px solid var(--gold-dark);border-radius:6px;padding:1px 6px;flex-shrink:0;letter-spacing:.04em;text-transform:uppercase}
.new-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.post-title{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4}
.post-preview{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-muted)}
.post-author{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--text-secondary)}
.post-stats{display:flex;gap:8px;margin-left:auto}
.like-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-muted);cursor:pointer;transition:all .15s}
.like-btn:hover{border-color:var(--red);color:var(--red)}
.like-btn.liked{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.comment-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-top:8px}
.comment-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:flex-start;gap:6px}
.comment-item:last-child{border-bottom:none}
.comment-body{flex:1}
.comment-author{font-weight:600;color:var(--gold);margin-right:4px}
.comment-text{color:var(--text-secondary)}
.comment-time{font-size:10px;color:var(--text-muted);display:block;margin-top:2px}
.comment-input-row{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.comment-input-row textarea{flex:1;min-height:36px;max-height:80px;font-size:12px;padding:6px 8px;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;resize:none}
.comment-input-row textarea:focus{outline:none;border-color:var(--gold)}
.post-detail-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;box-shadow:var(--shadow)}
.post-detail-body{font-size:14px;color:var(--text-secondary);line-height:1.7;margin:1rem 0;white-space:pre-wrap;word-break:break-word}

/* ── SCORECARD ── */
.sc-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.sc-tbl{border-collapse:collapse;font-size:11px;width:100%}
.sc-tbl th,.sc-tbl td{border:1px solid var(--border);padding:5px 4px;text-align:center;white-space:nowrap}
.sc-tbl .row-hdr th{background:var(--bg-secondary);font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.sc-tbl .row-par td{background:#161410;font-size:10px;font-weight:600;color:var(--gold)}
.col-player{text-align:left!important;padding-left:10px!important;min-width:110px;font-weight:600;white-space:nowrap;color:var(--text-primary)}
.col-player-hd{text-align:left!important;padding-left:10px!important;background:var(--bg-secondary)!important;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.col-sub{background:#1A1A18!important;font-weight:700;color:var(--text-primary)}
.col-tot{background:#0A160C!important;color:var(--green-light);font-weight:700}
.col-hcp{background:#1A1408!important;color:var(--gold);font-weight:600}
.col-net{background:#10101C!important;color:#9B80D4;font-weight:700}
.col-rank{background:#181410!important;font-weight:700}
.col-pts{background:#0A0E1A!important;color:#6090D0;font-weight:700}
.hd-sub{background:#2A2A28!important;color:var(--text-secondary);font-weight:700}
.hd-tot{background:var(--green)!important;color:#fff;font-weight:700}
.hd-hcp{background:var(--gold-dark)!important;color:#fff;font-weight:700}
.hd-net{background:#5040A0!important;color:#fff;font-weight:700}
.hd-rank{background:#404038!important;color:#fff;font-weight:700}
.hd-pts{background:var(--blue)!important;color:#fff;font-weight:700}
.eagle{background:#0A2040!important;color:#60A0E0!important;font-weight:700}
.birdie{background:var(--green-bg)!important;color:var(--green-light)!important;font-weight:700}
.bogey{background:#1A0808!important;color:var(--red)!important;font-weight:600}
.dbl-bogey{background:var(--red)!important;color:#fff!important;font-weight:700}
.hole-inp{width:28px;text-align:center;font-size:11px;border:1px solid var(--border-light);border-radius:3px;padding:2px 1px;background:var(--bg-secondary);color:var(--text-primary)}
.hole-inp:focus{outline:none;box-shadow:0 0 0 1.5px var(--gold)}
.hole-inp:disabled{opacity:.6;cursor:not-allowed}
.par-inp{width:24px;text-align:center;font-size:10px;border:1px solid var(--gold-dark);border-radius:3px;padding:1px;background:#161410;color:var(--gold)}
.par-inp:focus{outline:none;box-shadow:0 0 0 1.5px var(--gold)}
.net-under{color:var(--green-light)!important;font-weight:700}
.net-over{color:var(--red)!important;font-weight:700}
.net-even{color:var(--text-muted)!important;font-weight:600}
.rank-gold{color:var(--gold);font-weight:700}
.rank-silver{color:var(--silver);font-weight:700}
.rank-bronze{color:#A0522D;font-weight:700}
.sc-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-muted);align-items:center}
.sc-legend span{display:flex;align-items:center;gap:4px}
.tie-note{font-size:10px;color:var(--text-muted);font-weight:400}

/* ── DIVIDER ── */
.gold-divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent);margin:1.25rem 0}
/* ── LOGIN PAGE ── */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;background:var(--bg-primary)}
.login-logo-wrap{margin-bottom:.75rem;display:flex;align-items:center;justify-content:center;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(201,168,76,.25)}
.login-logo{height:90px;object-fit:contain;filter:contrast(1000) invert(1);padding:6px 12px}
.login-card{width:100%;max-width:380px}
.login-title{font-size:16px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-bottom:3px;white-space:nowrap}
.login-sub{font-size:10px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1.75rem;text-align:center}
.login-section-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.member-pick-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;margin-bottom:14px}
.member-pick-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.member-pick-item:hover,.member-pick-item:active{border-color:var(--gold);background:var(--gold-bg)}
.member-pick-name{font-size:13px;font-weight:600;color:var(--text-primary)}
.pin-header{text-align:center;margin-bottom:1.5rem}
.pin-selected-name{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:1.25rem 0}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);border:2px solid var(--border-light);transition:all .2s}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:230px;margin:0 auto}
.pin-key{padding:14px 0;font-size:22px;font-weight:600;text-align:center;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text-primary);transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.pin-key:hover{background:var(--bg-hover);border-color:var(--silver)}
.pin-key:active{transform:scale(.93);background:var(--gold-bg);border-color:var(--gold)}
@keyframes pinShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ── USER BAR ── */
.user-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 1rem;background:var(--bg-secondary);border-bottom:1px solid var(--border);font-size:11px;position:sticky;top:0;z-index:101}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.role-badge.admin{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-dark)}
.role-badge.member{background:var(--green-bg);color:var(--green-light);border:1px solid var(--green)}
.role-badge.guest{background:var(--silver-bg);color:var(--silver);border:1px solid var(--border)}
</style>
</head>
<body>



<div id="pageLogin" class="page active">
  <div class="login-wrap">
    <div class="login-title">Shoe Wedge Mafia Tour</div>
    <div class="login-sub">EST. 2020</div>
    <div class="login-card">
      <div id="loginStep1">
        <div class="login-section-label">Who are you?</div>
        <div class="member-pick-list" id="loginMemberList"></div>
        <div style="text-align:center;padding-top:6px">
          <button class="btn-link" style="font-size:12px;color:var(--text-muted)" onclick="loginAsGuest()">Continue as Guest (Read Only)</button>
        </div>
      </div>
      <div id="loginStep2" style="display:none">
        <div class="pin-header">
          <div class="pin-selected-name" id="loginSelectedName"></div>
          <div style="font-size:11px;color:var(--text-muted)">Enter your 4-digit PIN</div>
        </div>
        <div class="pin-dots">
          <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
          <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
        </div>
        <div class="pin-pad">
          <button class="pin-key" onclick="pinKey('1')">1</button>
          <button class="pin-key" onclick="pinKey('2')">2</button>
          <button class="pin-key" onclick="pinKey('3')">3</button>
          <button class="pin-key" onclick="pinKey('4')">4</button>
          <button class="pin-key" onclick="pinKey('5')">5</button>
          <button class="pin-key" onclick="pinKey('6')">6</button>
          <button class="pin-key" onclick="pinKey('7')">7</button>
          <button class="pin-key" onclick="pinKey('8')">8</button>
          <button class="pin-key" onclick="pinKey('9')">9</button>
          <button class="pin-key" onclick="loginStep1Back()" style="font-size:13px;color:var(--text-muted)">← Back</button>
          <button class="pin-key" onclick="pinKey('0')">0</button>
          <button class="pin-key" onclick="pinKey('del')" style="font-size:14px">⌫</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="pageMain" class="page">
  <div class="user-bar" id="userBar">
    <div style="display:flex;align-items:center;gap:8px">
      <div id="userBarAvatar"></div>
      <span id="userBarName" style="color:var(--text-primary);font-weight:600"></span>
      <span id="userBarRole" class="role-badge"></span>
    </div>
    <button class="btn-sm" onclick="logout()">Logout</button>
  </div>

<script>
const COLORS=[["#1A2A1A","#3D9A5A"],["#1A1A2A","#5A70A0"],["#2A1A08","#C9A84C"],["#2A0A0A","#CC5555"],["#1A0A2A","#8060C0"],["#0A1A2A","#4080B0"],["#1A1A0A","#808040"],["#1A1A1A","#888880"]];
const DEFAULT_PTS=[500,300,200,150,120,100,90,80,70,60,55,50,45,40,35,30,25,20,15,10];
const ADMIN_PIN="1234";
const CATS=[{id:"notice",label:"Notice",cls:"cat-notice"},{id:"general",label:"General",cls:"cat-general"},{id:"game",label:"Game",cls:"cat-game"},{id:"photo",label:"Photo",cls:"cat-photo"}];
const DEFAULT_PARS=[4,3,4,4,5,4,3,4,5,4,3,5,4,4,3,5,4,4];

/* ── SETUP: paste your values here after following the guide ── */
const CONFIG={
  appsScriptUrl:"https://script.google.com/macros/s/AKfycbwlnX_k2v7O8nmKZN_4KBbojrOEhziCCAFW-ogZpdPF8bejituMRTgOw4oX8Zmwx5rB7w/exec",
  oneSignalAppId:"",
};
let SESSION={pid:null,role:"guest",name:"Guest",loggedIn:false};

let S={name:"Shoe Wedge Mafia Tour",totalGames:13,players:[],games:[],pointsTable:DEFAULT_PTS.slice(),posts:[],readPostIds:[],pendingMembers:[],view:0,game:0,adminMode:false,boardFilter:"all"};

function initPlayers(){
  const alpha="ABCDEFGHIJKLMNOPQ".split("");
  const hcps=[99,87,102,95,110,88,76,93,105,84,97,115,91,78,103,89,96];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  alpha.forEach((l,i)=>S.players.push({id:i+1,firstName:l,lastName:l,handicap:hcps[i],birthday:months[i%12]+" "+((i*7+5)%28+1),joinYear:2018+(i%6),photo:null,awards:[],bio:"",phone:"",email:"",pin:"0000",role:"member"}));
}
function initGames(){S.games=Array.from({length:S.totalGames},(_,i)=>({id:i+1,name:"Game "+(i+1),done:false,scores:{},holes:{},pars:DEFAULT_PARS.slice()}));}
function initPosts(){
  S.posts=[
    {id:1,author:"Admin",cat:"notice",title:"Welcome to Shoe Wedge Mafia Tour!",body:"The season has started! EST. 2020 · Tisdale Hotel & Pub",pinned:true,likes:[],comments:[{id:1,author:"A A",text:"Let's go!",time:"10:00"}],time:"2024-01-01"},
    {id:2,author:"B B",cat:"game",title:"Game 1 Recap — What a battle!",body:"Great effort from everyone in Game 1.",pinned:false,likes:[],comments:[],time:"2024-03-15"},
  ];
  S.readPostIds=[];
}
function save(){try{localStorage.setItem("swmt_branded",JSON.stringify(S));}catch(e){}if(CONFIG.appsScriptUrl)syncToSheet();}
function load(){
  try{
    const d=localStorage.getItem("swmt_branded");
    if(d){Object.assign(S,JSON.parse(d));fixAll();return true;}
    for(const k of["swmt_final","swmt_v10","swmt_v9"]){const old=localStorage.getItem(k);if(old){Object.assign(S,JSON.parse(old));fixAll();return true;}}
  }catch(e){}
  return false;
}
function fixAll(){
  S.players.forEach(p=>{if(!p.birthday)p.birthday="Jan 01";if(!p.joinYear)p.joinYear=2020;if(!p.awards)p.awards=[];if(!p.bio)p.bio="";if(p.photo===undefined)p.photo=null;if(p.handicap==null)p.handicap=90;if(!p.phone)p.phone="";if(!p.email)p.email="";if(!p.pin)p.pin="0000";if(!p.role)p.role="member";});
  S.games.forEach(g=>{if(!g.holes)g.holes={};if(!g.pars)g.pars=DEFAULT_PARS.slice();S.players.forEach(p=>{const hs=g.holes[p.id];if(hs&&hs.some(v=>v!=null&&v!=""))g.scores[p.id]=hs.reduce((s,v)=>s+(v!=null&&v!=""?Number(v):0),0);});});
  if(!S.posts)S.posts=[];if(!S.readPostIds)S.readPostIds=[];if(!S.boardFilter)S.boardFilter="all";if(!S.pendingMembers)S.pendingMembers=[];
}

function computeNetResults(g){
  const entries=S.players.map(p=>{const tot=g.scores[p.id]!=null?Number(g.scores[p.id]):null;const hcpVal=p.handicap!=null?p.handicap:0;const net=tot!=null?tot-hcpVal:null;return{pid:p.id,tot,net};}).filter(e=>e.net!=null).sort((a,b)=>a.net-b.net);
  let rank=1;for(let i=0;i<entries.length;i++){entries[i].rank=i>0&&entries[i].net===entries[i-1].net?entries[i-1].rank:rank;rank++;}
  const result={};let i=0;
  while(i<entries.length){const tieVal=entries[i].net;let j=i;while(j<entries.length&&entries[j].net===tieVal)j++;const tieCount=j-i,startRank=entries[i].rank;let ptSum=0;for(let k=0;k<tieCount;k++)ptSum+=S.pointsTable[startRank-1+k]||0;const ptShare=ptSum/tieCount;for(let k=i;k<j;k++)result[entries[k].pid]={rank:entries[k].rank,pts:ptShare,net:entries[k].net,tied:tieCount>1};i=j;}
  return result;
}
function getHoles(g,pid){if(!g.holes[pid])g.holes[pid]=Array(18).fill(null);return g.holes[pid];}
function recomputeScore(g,pid){const hs=g.holes[pid]||[];const filled=hs.filter(v=>v!=null&&v!="");if(!filled.length){delete g.scores[pid];return;}g.scores[pid]=hs.reduce((s,v)=>s+(v!=null&&v!=""?Number(v):0),0);}
function holeClass(score,par){if(score==null||score==""||par==null)return"";const d=Number(score)-par;if(d<=-2)return"eagle";if(d===-1)return"birdie";if(d===0)return"";if(d===1)return"bogey";return"dbl-bogey";}
function getStatsUpTo(pid,excLast){const done=S.games.filter(g=>g.done);const games=excLast?done.slice(0,-1):done;let total=0,wins=0,top3=0,played=0;games.forEach(g=>{const r=getRanked(g),i=r.findIndex(x=>x.pid===pid);if(i<0)return;played++;total+=S.pointsTable[i]||0;if(i===0)wins++;if(i<3)top3++;});return{total,wins,top3,played};}
function getRankChanges(){const done=S.games.filter(g=>g.done);if(done.length<2)return{};const cur=S.players.map(p=>({id:p.id,total:getStatsUpTo(p.id,false).total})).sort((a,b)=>b.total-a.total);const prev=S.players.map(p=>({id:p.id,total:getStatsUpTo(p.id,true).total})).sort((a,b)=>b.total-a.total);const ch={};cur.forEach((p,i)=>{const pi=prev.findIndex(x=>x.id===p.id);ch[p.id]=pi-i;});return ch;}
function rankChgEl(diff){if(diff===0||diff==null)return'<div class="rank-chg"><span class="rank-eq">—</span></div>';if(diff>0)return'<div class="rank-chg"><span class="rank-up">▲</span><span class="rank-num up">'+diff+'</span></div>';return'<div class="rank-chg"><span class="rank-dn">▼</span><span class="rank-num dn">'+Math.abs(diff)+'</span></div>';}
function getUnreadCount(){return S.posts.filter(p=>!S.readPostIds.includes(p.id)).length;}
function markRead(id){if(!S.readPostIds.includes(id)){S.readPostIds.push(id);save();}updateUnreadBadge();}
function updateUnreadBadge(){const c=getUnreadCount(),b=document.getElementById("unreadBadge");if(b){if(c>0){b.textContent=c>99?"99+":c;b.style.display="inline-flex";}else b.style.display="none";}updateBadge(c);}
function getRanked(g){return Object.entries(g.scores).filter(([,v])=>v!=null&&v!="").map(([pid,sc])=>({pid:Number(pid),score:Number(sc)})).sort((a,b)=>a.score-b.score);}
function getStats(pid){let total=0,wins=0,top3=0,played=0;S.games.forEach(g=>{if(!g.done)return;const r=getRanked(g),i=r.findIndex(x=>x.pid===pid);if(i<0)return;played++;total+=S.pointsTable[i]||0;if(i===0)wins++;if(i<3)top3++;});return{total,wins,top3,played};}
function getStandings(){return S.players.map(p=>({...p,...getStats(p.id)})).sort((a,b)=>b.total-a.total);}
function av(p,size){size=size||28;const[bg,tc]=COLORS[p.id%COLORS.length];return'<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+bg+';color:'+tc+';font-size:'+(size<36?10:Math.floor(size/3.2))+'px;border:1px solid '+tc+'40">'+(p.firstName[0]||"")+(p.lastName[0]||"")+'</div>';}
function avByName(name,size){size=size||22;const p=S.players.find(x=>(x.firstName+" "+x.lastName)===name);if(p)return av(p,size);return'<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:#1A1A18;color:#888;font-size:10px;border:1px solid #333">'+name.slice(0,2)+'</div>';}
function ptsClass(v){return v>=300?"pts-high":v>=100?"pts-mid":"pts-low";}
function hcpTag(p){return'<span class="hcp-tag">'+(p.handicap!=null?p.handicap:"—")+'</span>';}
function catInfo(id){return CATS.find(c=>c.id===id)||{label:id,cls:"cat-general"};}
function newId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1;}
function ordinal(n){return n+(n===1?"st":n===2?"nd":n===3?"rd":"th");}
function rankBadgeClass(r){return r===1?"rank-gold":r===2?"rank-silver":r===3?"rank-bronze":"";}
function formatPts(v,tied){const str=Number.isInteger(v)?v.toString():v.toFixed(1);return str+(tied?'<span class="tie-note"> (split)</span>':"");}

function navScorecard(gid){S._scorecardGid=gid;document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById("pageScorecard").classList.add("active");renderScorecard(gid);}
function navBackToGame(){nav("main");setView(1,document.getElementById("vtab1"));}

function renderScorecard(gid){
  const g=S.games.find(x=>x.id===gid);if(!g)return;
  const pars=g.pars||DEFAULT_PARS.slice();
  const parF=pars.slice(0,9).reduce((s,v)=>s+(v||4),0),parB=pars.slice(9).reduce((s,v)=>s+(v||4),0),parTot=parF+parB;
  const netResults=computeNetResults(g);
  let hdr='<th class="col-player-hd">Player</th>';
  for(let h=1;h<=9;h++)hdr+='<th>'+h+'</th>';
  hdr+='<th class="hd-sub">OUT</th>';
  for(let h=10;h<=18;h++)hdr+='<th>'+h+'</th>';
  hdr+='<th class="hd-sub">IN</th><th class="hd-tot">TOT</th><th class="hd-hcp">HCP</th><th class="hd-net">NET</th><th class="hd-rank">RANK</th><th class="hd-pts">PTS</th>';
  let parCells='<td class="col-player" style="color:var(--gold);font-size:10px">Par</td>';
  for(let h=0;h<9;h++)parCells+='<td><input class="par-inp" type="number" value="'+(pars[h]||4)+'" min="3" max="6" onchange="setPar('+gid+','+h+',this.value)"></td>';
  parCells+='<td class="col-sub">'+parF+'</td>';
  for(let h=9;h<18;h++)parCells+='<td><input class="par-inp" type="number" value="'+(pars[h]||4)+'" min="3" max="6" onchange="setPar('+gid+','+h+',this.value)"></td>';
  parCells+='<td class="col-sub">'+parB+'</td><td class="col-tot">'+parTot+'</td><td class="col-hcp">—</td><td class="col-net">—</td><td class="col-rank">—</td><td class="col-pts">—</td>';
  const sortedPlayers=[...S.players].sort((a,b)=>{const na=netResults[a.id],nb=netResults[b.id];if(na&&nb)return na.net-nb.net;if(na)return-1;if(nb)return 1;return a.id-b.id;});
  let rows=sortedPlayers.map(p=>{
    const hs=getHoles(g,p.id);
    const f9=hs.slice(0,9).reduce((s,v)=>s+(v!=null&&v!=""?Number(v):0),0);
    const b9=hs.slice(9).reduce((s,v)=>s+(v!=null&&v!=""?Number(v):0),0);
    const hasFront=hs.slice(0,9).some(v=>v!=null&&v!=""),hasBack=hs.slice(9).some(v=>v!=null&&v!=""),hasAny=hs.some(v=>v!=null&&v!="");
    const tot=hasAny?f9+b9:null,hcpVal=p.handicap!=null?p.handicap:0,net=tot!=null?tot-hcpVal:null,nr=netResults[p.id];
    const[bg,tc]=COLORS[p.id%COLORS.length];
    let cells='<td class="col-player"><div style="display:flex;align-items:center;gap:5px"><div class="avatar" style="width:20px;height:20px;background:'+bg+';color:'+tc+';font-size:8px;border:1px solid '+tc+'40;flex-shrink:0">'+(p.firstName[0]||"")+(p.lastName[0]||"")+'</div><span>'+p.firstName+' '+p.lastName+'</span></div></td>';
    for(let h=0;h<9;h++){const v=hs[h];cells+='<td class="'+holeClass(v,pars[h])+'"><input class="hole-inp" type="number" value="'+(v!=null&&v!=""?v:"")+'" min="1" max="20" placeholder="·" onchange="setHole('+gid+','+p.id+','+h+',this.value)" '+(g.done?"disabled":"")+"></td>";}
    cells+='<td class="col-sub">'+(hasFront?f9:"")+'</td>';
    for(let h=9;h<18;h++){const v=hs[h];cells+='<td class="'+holeClass(v,pars[h])+'"><input class="hole-inp" type="number" value="'+(v!=null&&v!=""?v:"")+'" min="1" max="20" placeholder="·" onchange="setHole('+gid+','+p.id+','+h+',this.value)" '+(g.done?"disabled":"")+"></td>";}
    cells+='<td class="col-sub">'+(hasBack?b9:"")+'</td>';
    cells+='<td class="col-tot">'+(tot!=null?tot:"")+'</td>';
    cells+='<td class="col-hcp">'+hcpVal+'</td>';
    let netStr="",netCls="col-net";
    if(net!=null){const diff=net-parTot;netStr=net.toString();if(diff<0)netCls+=" net-under";else if(diff>0)netCls+=" net-over";else netCls+=" net-even";}
    cells+='<td class="'+netCls+'">'+netStr+'</td>';
    let rankStr="";if(nr){const rc=rankBadgeClass(nr.rank);rankStr='<span class="'+rc+'">'+ordinal(nr.rank)+(nr.tied?' 🤝':"")+'</span>';}
    cells+='<td class="col-rank">'+rankStr+'</td>';
    cells+='<td class="col-pts">'+(nr?formatPts(nr.pts,nr.tied):"")+'</td>';
    return'<tr>'+cells+'</tr>';
  }).join("");
  const tieGroups=[];const seen=new Set();
  for(const pid in netResults){const nr=netResults[pid];if(nr.tied&&!seen.has(nr.rank)){const tied=Object.entries(netResults).filter(([,v])=>v.rank===nr.rank);tieGroups.push({rank:nr.rank,count:tied.length,pts:nr.pts,net:nr.net});seen.add(nr.rank);}}
  const tieSummary=tieGroups.length?'<div style="margin-top:10px;padding:10px 12px;background:#10101C;border:1px solid #5040A0;border-radius:var(--radius);font-size:11px;color:#9B80D4"><strong>Tie splits:</strong> '+tieGroups.map(t=>t.count+' players tied for '+ordinal(t.rank)+' (NET '+t.net+') → <strong>'+(Number.isInteger(t.pts)?t.pts:t.pts.toFixed(1))+' pts each</strong>').join(" · ")+'</div>':"";
  const legend='<div class="sc-legend"><span><span style="width:12px;height:12px;border-radius:50%;background:#0A2040;border:1px solid #6090D0;display:inline-block"></span> Eagle</span><span><span style="width:12px;height:12px;border-radius:50%;background:var(--green-bg);border:1px solid var(--green-light);display:inline-block"></span> Birdie</span><span><span style="width:12px;height:12px;background:var(--red-bg);border:1px solid var(--red);display:inline-block"></span> Bogey</span><span><span style="width:12px;height:12px;background:var(--red);display:inline-block"></span> Dbl+</span><span style="color:var(--gold)">🤝 = Tied · Points split evenly</span></div>';
  document.getElementById("scorecardContent").innerHTML=
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px">'+
    '<div><h2 style="font-size:18px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em">'+g.name+' — Score Card</h2>'+
    '<p style="font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase">Par '+parTot+' · 18 holes · Ranked by NET · Ties split evenly</p></div>'+
    (can("admin")?(g.done?'<button class="btn" onclick="reopenGame('+g.id+')">Reopen</button>':'<button class="btn btn-gold" onclick="finalizeGame('+g.id+')">Finalize &amp; Award Points</button>'):'')+
    '</div>'+
    '<div class="sc-outer"><table class="sc-tbl"><thead><tr class="row-hdr">'+hdr+'</tr><tr class="row-par">'+parCells+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    tieSummary+legend;
}

function setPar(gid,h,val){const g=S.games.find(x=>x.id===gid);if(!g)return;if(!g.pars)g.pars=DEFAULT_PARS.slice();g.pars[h]=Number(val)||4;save();renderScorecard(gid);}
function setHole(gid,pid,h,val){const g=S.games.find(x=>x.id===gid);if(!g||g.done)return;if(!g.holes[pid])g.holes[pid]=Array(18).fill(null);g.holes[pid][h]=val===""?null:Number(val);recomputeScore(g,pid);save();renderScorecard(gid);}

function renderAll(){
  document.getElementById("gamesInfo").textContent=S.games.filter(g=>g.done).length+" / "+S.totalGames+" games";
  renderStats();updateUnreadBadge();
  if(S.view===0)renderStandings();else if(S.view===1)renderGames();else if(S.view===2)renderPts();else renderBoard();
  const pg=document.querySelector(".page.active");
  if(pg){if(pg.id==="pageProfiles")renderProfiles();if(pg.id==="pageDetail"&&S._detailPid)renderDetail(S._detailPid);if(pg.id==="pagePostDetail"&&S._postId!=null)renderPostDetail(S._postId);if(pg.id==="pageScorecard"&&S._scorecardGid)renderScorecard(S._scorecardGid);}
  save();
}

    '</div>';
  });

  const allTab='<button class="gtab '+(S.game===-1?"active":"")+'" onclick="setGame(-1)">All games</button>';

      '<div style="text-align:center;font-size:10px;color:var(--text-muted)">'+(nr&&nr.tied?'🤝 tied':"")+'</div>'+

    '</div>'+
    '<div class="table-wrap"><div class="t-head" style="grid-template-columns:'+cols+'"><span>#</span><span>Player</span><span style="text-align:center">TOT</span><span style="text-align:center;color:var(--gold)">HCP</span><span style="text-align:center;color:#9B80D4">NET</span><span style="text-align:center">Points</span><span></span></div>'+rows+'</div>';

function renderAllGames(tabs){
  const done=S.games.filter(g=>g.done);let html=tabs;
  if(!done.length){html+='<div class="empty">No finalized games yet. The hunt begins soon.</div>';}
  else done.forEach(g=>{
    const netResults=computeNetResults(g),sorted=Object.entries(netResults).sort((a,b)=>a[1].rank-b[1].rank).slice(0,5),cols="36px 1fr 55px 70px";
    let rows=sorted.map(([pid,nr])=>{const p=S.players.find(x=>x.id===Number(pid))||{firstName:"?",lastName:"",id:0,handicap:null};const bc=nr.rank===1?"p1":nr.rank===2?"p2":nr.rank===3?"p3":"pn";return'<div class="t-row" style="grid-template-columns:'+cols+'"><div class="pos-badge '+bc+'" style="margin:auto">'+nr.rank+'</div><div style="display:flex;align-items:center;gap:8px">'+av(p,24)+'<span style="font-size:13px;font-weight:600">'+p.firstName+' '+p.lastName+'</span>'+hcpTag(p)+'</div><div style="text-align:center;font-size:12px;font-weight:700;color:#9B80D4">'+nr.net+'</div><div style="text-align:center"><span class="pts-badge '+ptsClass(nr.pts)+'">'+formatPts(nr.pts,nr.tied)+'</span></div></div>';}).join("");
    if(Object.keys(netResults).length>5)rows+='<div style="padding:6px 12px;font-size:11px;color:var(--text-muted)">+ '+(Object.keys(netResults).length-5)+' more</div>';
    html+='<div style="margin-bottom:16px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">'+g.name+'<span class="chip-done" style="margin-left:6px">done</span></div><button class="btn-link" onclick="navScorecard('+g.id+')">Score Card &#8594;</button></div><button class="btn-sm" onclick="setGame('+(g.id-1)+')">Details</button></div><div class="table-wrap"><div class="t-head" style="grid-template-columns:'+cols+'"><span>#</span><span>Player</span><span style="text-align:center;color:#9B80D4">NET</span><span style="text-align:center">Points</span></div>'+rows+'</div></div>';
  });
  document.getElementById("v1").innerHTML=html;
}

function renderPts(){
  const rows=S.pointsTable.map((v,i)=>'<div class="pts-row"><span style="color:var(--text-secondary)">'+(i+1)+(i===0?"st":i===1?"nd":i===2?"rd":"th")+' place</span><span style="font-weight:700;color:var(--gold)">'+v+'</span></div>').join("");

function renderBoard(){
  const posts=S.posts||[];const cats=[{id:"all",label:"All"},...CATS];
  const fh=cats.map(c=>'<button class="fchip '+(S.boardFilter===c.id?"active":"")+'" onclick="setBoardFilter(\''+c.id+'\')">'+(c.label)+'</button>').join("");
  const filtered=S.boardFilter==="all"?posts:posts.filter(p=>p.cat===S.boardFilter);
  const sorted=[...filtered.filter(p=>p.pinned),...filtered.filter(p=>!p.pinned).sort((a,b)=>b.id-a.id)];
  let ph='<div class="empty">No posts yet. Be the first to speak up.</div>';
  if(sorted.length)ph=sorted.map(post=>{const ci=catInfo(post.cat),isUnread=!S.readPostIds.includes(post.id);return'<div class="post-card '+(post.pinned?"pinned":"")+" "+(isUnread?"unread":"")+'" onclick="navPost('+post.id+')"><div class="post-top">'+(post.pinned?'<span class="pin-icon">Pinned</span>':'')+(isUnread?'<span class="new-dot"></span>':'')+'<span class="post-cat '+ci.cls+'">'+ci.label+'</span><span style="font-size:11px;color:var(--text-muted);margin-left:auto">'+post.time+'</span></div><div class="post-title">'+post.title+'</div><div class="post-preview">'+post.body+'</div><div class="post-meta"><div class="post-author">'+avByName(post.author,18)+' '+post.author+'</div><div class="post-stats"><span style="display:flex;align-items:center;gap:3px;color:'+(post.likes&&post.likes.length>0?"var(--red)":"var(--text-muted)")+'">&#9825; '+(post.likes?post.likes.length:0)+'</span><span style="display:flex;align-items:center;gap:3px">&#128172; '+(post.comments?post.comments.length:0)+'</span></div></div></div>';}).join("");
  document.getElementById("v3").innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><p style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">'+S.name+' · '+posts.length+' posts</p>'+(can("member")?'<button class="btn btn-gold" onclick="showModal(\'writePost\')">+ Write</button>':'')+'</div><div class="board-filter">'+fh+'</div><div class="post-list">'+ph+'</div>';
}

function renderPostDetail(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;S._postId=postId;markRead(postId);
  const ci=catInfo(post.cat);

  const liked=post.likes&&post.likes.includes(likeKey);
  const comments=(post.comments||[]).map(c=>'<div class="comment-item">'+avByName(c.author,22)+'<div class="comment-body"><span class="comment-author">'+c.author+'</span><span class="comment-text"> '+c.text+'</span><span class="comment-time">'+c.time+'</span></div>'+(can("admin")?'<button class="btn-sm btn-red" style="flex-shrink:0" onclick="deleteComment('+postId+','+c.id+')">Del</button>':'')+'</div>').join("");

    ?'<div style="margin-top:14px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em">Commenting as:</span><span style="font-size:12px;color:var(--gold);font-weight:600">'+SESSION.name+'</span></div><div class="comment-input-row"><textarea id="cmtText" placeholder="Your message..."></textarea><button class="btn btn-gold" style="white-space:nowrap" onclick="addComment('+postId+')">Post</button></div></div>'

}

    const aw=p.awards&&p.awards.length?'<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Awards</div>'+p.awards.slice(0,2).map(a=>'<span class="award-chip">'+a+'</span>').join("")+(p.awards.length>2?'<span style="font-size:10px;color:var(--text-muted)"> +'+(p.awards.length-2)+' more</span>':"")+'</div>':"";

function setBoardFilter(cat){S.boardFilter=cat;renderBoard();}
function navPost(id){S._postId=id;renderPostDetail(id);nav("postDetail");}
function toggleLike(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  if(!SESSION.loggedIn){alert("Log in to like posts.");return;}
  if(!post.likes)post.likes=[];
  const key=SESSION.role==="admin"?"admin":(SESSION.pid||0);
  const idx=post.likes.indexOf(key);
  if(idx>=0)post.likes.splice(idx,1);else post.likes.push(key);
  renderPostDetail(postId);save();
}
function addComment(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  if(!can("member")){alert("Log in as a member to comment.");return;}
  const text=(document.getElementById("cmtText").value||"").trim();
  if(!text)return;
  if(!post.comments)post.comments=[];
  const now=new Date();
  post.comments.push({id:newId(post.comments),author:SESSION.name,text,time:now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0")});
  renderPostDetail(postId);save();
}
function deleteComment(postId,cid){const post=S.posts.find(p=>p.id===postId);if(!post||!can("admin"))return;post.comments=post.comments.filter(c=>c.id!==cid);renderPostDetail(postId);save();}
function deletePost(postId){if(!can("admin"))return;if(!confirm("Delete this post?"))return;S.posts=S.posts.filter(p=>p.id!==postId);setView(3,document.getElementById("vtab3"));save();}
function nav(page){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));const pg=document.getElementById("page"+page.charAt(0).toUpperCase()+page.slice(1));if(pg)pg.classList.add("active");if(page==="profiles")renderProfiles();if(page==="main")renderAll();if(page==="postDetail"&&S._postId!=null)renderPostDetail(S._postId);}
function navDetail(pid){S._detailPid=pid;renderDetail(pid);nav("detail");}
function setView(i,el){S.view=i;document.querySelectorAll(".vtab").forEach(t=>{t.classList.remove("active");t.classList.remove("active-gold");});if(el)el.classList.add("active");[0,1,2,3].forEach(n=>document.getElementById("v"+n).style.display=n===i?"":"none");document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById("pageMain").classList.add("active");renderAll();}
function setGame(i){S.game=i;renderGames();}
function finalizeGame(gid){const g=S.games.find(x=>x.id===gid);if(!g)return;if(!Object.values(g.scores).some(v=>v!=null&&v!=""))return alert("Please enter at least one score.");if(!confirm("Finalize "+g.name+" and award points?"))return;g.done=true;renderAll();if(document.querySelector("#pageScorecard.active"))renderScorecard(gid);}
function reopenGame(gid){if(!confirm("Reopen this game?"))return;const g=S.games.find(x=>x.id===gid);if(g){g.done=false;renderAll();if(document.querySelector("#pageScorecard.active"))renderScorecard(gid);}}
function openEdit(id){S._ep=id;showModal("editPlayer",S.players.find(x=>x.id===id));}
function adminThenProfile(pid){S._ep=pid;S._adminNext="profile";showModal("adminPin");}
function checkPin(){const pin=document.getElementById("mAdminPin").value;if(pin===ADMIN_PIN){setSession(null,"admin","Admin");closeModal();if(S._adminNext==="profile"){S._adminNext=null;setTimeout(()=>renderDetail(S._ep),50);}else setTimeout(()=>openEdit(S._ep),50);updateUserBar();const ab=document.getElementById("adminButtons");if(ab)ab.style.display="flex";}else alert("Incorrect PIN. Access denied.");}

  else if(type==="settings"){area.innerHTML=wrap('<h2>Settings</h2><div class="fg"><label>Tour name</label><input id="mTn" type="text" value="'+S.name+'"></div><div class="fg"><label>Total games in season</label><input id="mTg" type="number" value="'+S.totalGames+'" min="1" max="30"></div><div class="row-btns"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="confirmSettings()">Save</button></div>');}
  else if(type==="joinRequest"){area.innerHTML=wrap('<h2>Request to Join</h2><p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.5">Fill in your details below. An admin will review and approve your request.</p><div class="fg"><label>First name <span style="color:var(--red)">*</span></label><input id="jFn" type="text"></div><div class="fg"><label>Last name</label><input id="jLn" type="text"></div><div class="fg"><label>Phone <span style="color:var(--red)">*</span> <span style="font-size:10px;color:var(--text-muted)">e.g. +16041234567</span></label><input id="jPh" type="tel" placeholder="+16041234567"></div><div class="fg"><label>Email <span style="color:var(--red)">*</span></label><input id="jEm" type="email" placeholder="name@email.com"></div><div class="fg"><label>Choose a 4-digit PIN <span style="color:var(--red)">*</span> <span style="font-size:10px;color:var(--text-muted)">You will use this to log in</span></label><input id="jPin" type="password" maxlength="4" pattern="[0-9]{4}" placeholder="••••" inputmode="numeric"></div><div class="fg"><label>Handicap</label><input id="jHcp" type="number" min="0" max="200" placeholder="optional"></div><div class="fg"><label>Birthday <span style="font-size:10px;color:var(--text-muted)">e.g. Jan 15</span></label><input id="jBd" type="text" placeholder="Jan 15"></div><div class="fg"><label>Member since (year)</label><input id="jJy" type="number" placeholder="2024"></div><div class="row-btns"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="confirmJoinRequest()">Submit Request</button></div>');}
  else if(type==="editPts"){const inputs=S.pointsTable.slice(0,20).map((v,i)=>'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;color:var(--text-muted);width:60px;text-transform:uppercase;letter-spacing:.03em">'+(i+1)+(i===0?"st":i===1?"nd":i===2?"rd":"th")+'</span><input type="number" id="pt'+i+'" value="'+v+'" style="width:80px" min="0"></div>').join("");area.innerHTML=wrap('<h2>Edit Points Table</h2>'+inputs+'<div class="row-btns"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="confirmPts()">Save</button></div>');}
}
function closeModal(){document.getElementById("modalArea").innerHTML="";}
function reqAdmin(){closeModal();setTimeout(()=>showModal("adminPin"),50);}
function confirmPost(){const title=(document.getElementById("pwTitle").value||"").trim();const body=(document.getElementById("pwBody").value||"").trim();const who=document.getElementById("pwWho").value||"Guest";const cat=document.getElementById("pwCat").value||"general";const pinEl=document.getElementById("pwPin");const pinned=pinEl&&pinEl.checked;if(!title||!body)return alert("Please enter a title and content.");const now=new Date();const ds=now.getFullYear()+"-"+(now.getMonth()+1).toString().padStart(2,"0")+"-"+now.getDate().toString().padStart(2,"0");if(!S.posts)S.posts=[];const np={id:newId(S.posts),author:who,cat,title,body,pinned,likes:[],comments:[],time:ds};S.posts.unshift(np);S.readPostIds.push(np.id);save();closeModal();renderAll();if(CONFIG.appsScriptUrl)notifyAll(np);}
function confirmAdd(){const fn=(document.getElementById("mFn").value||"").trim();if(!fn)return alert("First name is required.");const ph=(document.getElementById("mPh").value||"").trim();const em=(document.getElementById("mEm").value||"").trim();if(!ph)return alert("Phone number is required.");if(!em||!em.includes("@"))return alert("Valid email address is required.");const id=Math.max(0,...S.players.map(p=>p.id))+1;const hcp=document.getElementById("mHcp").value;S.players.push({id,firstName:fn,lastName:(document.getElementById("mLn").value||"").trim(),phone:ph,email:em,handicap:hcp?Number(hcp):null,birthday:(document.getElementById("mBd").value||"").trim(),joinYear:Number(document.getElementById("mJy").value)||null,awards:[],bio:"",photo:null});closeModal();renderAll();}
function confirmEdit(){const p=S.players.find(x=>x.id===S._ep);if(!p)return;p.firstName=(document.getElementById("mFn").value||p.firstName).trim();p.lastName=(document.getElementById("mLn").value||p.lastName).trim();const ph=document.getElementById("mPh");const em=document.getElementById("mEm");if(ph&&ph.value.trim())p.phone=ph.value.trim();if(em&&em.value.trim())p.email=em.value.trim();if(can("admin")){const h=document.getElementById("mHcp").value;p.handicap=h!=""?Number(h):null;}closeModal();renderAll();}
function confirmEditProfile(){const p=S.players.find(x=>x.id===S._ep);if(!p)return;p.firstName=(document.getElementById("mFn").value||p.firstName).trim();p.lastName=(document.getElementById("mLn").value||p.lastName).trim();const ph=(document.getElementById("mPh").value||"").trim();const em=(document.getElementById("mEm").value||"").trim();if(!ph)return alert("Phone number is required.");if(!em||!em.includes("@"))return alert("Valid email address is required.");p.phone=ph;p.email=em;const h=document.getElementById("mHcp").value;p.handicap=h!=""?Number(h):null;p.birthday=(document.getElementById("mBd").value||"").trim();const jy=document.getElementById("mJy").value;p.joinYear=jy?Number(jy):null;const aw=document.getElementById("mAw").value;p.awards=aw?aw.split(",").map(a=>a.trim()).filter(Boolean):[];p.bio=(document.getElementById("mBio").value||"").trim();closeModal();renderDetail(p.id);renderAll();}
function removePlayer(){if(!confirm("Remove this player from the family?"))return;S.players=S.players.filter(x=>x.id!==S._ep);closeModal();renderAll();}
function confirmGame(){const name=(document.getElementById("mGn").value||"").trim()||"Game "+(S.games.length+1);S.games.push({id:S.games.length+1,name,done:false,scores:{},holes:{},pars:DEFAULT_PARS.slice()});S.totalGames=S.games.length;closeModal();renderAll();}
function confirmSettings(){S.name=(document.getElementById("mTn").value||S.name).trim();const tg=parseInt(document.getElementById("mTg").value)||S.totalGames;for(let i=S.games.length;i<tg;i++)S.games.push({id:i+1,name:"Game "+(i+1),done:false,scores:{},holes:{},pars:DEFAULT_PARS.slice()});S.totalGames=tg;closeModal();renderAll();}
function confirmPts(){S.pointsTable=S.pointsTable.map((_,i)=>{const el=document.getElementById("pt"+i);return el?Number(el.value)||0:0;});closeModal();renderAll();}
function confirmJoinRequest(){
  const fn=(document.getElementById("jFn").value||"").trim();
  const ph=(document.getElementById("jPh").value||"").trim();
  const em=(document.getElementById("jEm").value||"").trim();
  const pin=(document.getElementById("jPin").value||"").trim();
  if(!fn)return alert("First name is required.");
  if(!ph)return alert("Phone number is required.");
  if(!em||!em.includes("@"))return alert("Valid email is required.");
  if(!/^\d{4}$/.test(pin))return alert("Please choose a 4-digit PIN.");
  const req={id:Date.now(),firstName:fn,lastName:(document.getElementById("jLn").value||"").trim(),phone:ph,email:em,pin,handicap:document.getElementById("jHcp").value?Number(document.getElementById("jHcp").value):null,birthday:(document.getElementById("jBd").value||"").trim(),joinYear:Number(document.getElementById("jJy").value)||new Date().getFullYear(),requestedAt:new Date().toISOString().slice(0,10),status:"pending"};
  S.pendingMembers.push(req);save();closeModal();
  if(CONFIG.appsScriptUrl)notifyAdmin(req);
  alert("Request submitted! An admin will review it shortly.");
}
function approveMember(id){
  const idx=S.pendingMembers.findIndex(r=>r.id===id);if(idx<0)return;
  const r=S.pendingMembers[idx];
  const pid=Math.max(0,...S.players.map(p=>p.id))+1;
  S.players.push({id:pid,firstName:r.firstName,lastName:r.lastName,phone:r.phone,email:r.email,pin:r.pin||"0000",role:"member",handicap:r.handicap,birthday:r.birthday,joinYear:r.joinYear,awards:[],bio:"",photo:null});
  S.pendingMembers.splice(idx,1);save();renderProfiles();renderAll();
}
function rejectMember(id){
  if(!confirm("Reject this request?"))return;
  S.pendingMembers=S.pendingMembers.filter(r=>r.id!==id);save();renderProfiles();
}
async function notifyAdmin(req){
  if(!CONFIG.appsScriptUrl)return;
  try{await fetch(CONFIG.appsScriptUrl,{method:"POST",body:JSON.stringify({action:"notifyAdmin",req}),headers:{"Content-Type":"text/plain"}});}catch(e){console.warn("Admin notify failed",e);}
}

// ── PERMISSION ────────────────────────────────────────────────────
function can(action){
  if(SESSION.role==="admin")return true;
  if(action==="member")return SESSION.role==="member";
  return false;
}

// ── LOGIN SYSTEM ─────────────────────────────────────────────────
let _pinBuffer="",_loginPid=null;

function renderLoginMemberList(){
  const list=document.getElementById("loginMemberList");if(!list)return;
  const items=S.players.map(p=>'<div class="member-pick-item" onclick="loginSelectMember('+p.id+')">'+avByName(p.firstName+" "+p.lastName,28)+'<div class="member-pick-name">'+p.firstName+" "+p.lastName+'</div></div>').join("");
  list.innerHTML='<div class="member-pick-item" style="border-color:var(--gold-dark)" onclick="loginAsAdmin()"><div style="width:28px;height:28px;border-radius:50%;background:var(--gold);color:#000;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">A</div><div class="member-pick-name" style="color:var(--gold)">Admin</div></div>'+items;
}

function loginSelectMember(pid){
  const p=S.players.find(x=>x.id===pid);if(!p)return;
  _loginPid=pid;_pinBuffer="";
  document.getElementById("loginSelectedName").textContent=p.firstName+" "+p.lastName;
  updatePinDots();showLoginStep(2);
}

function loginAsAdmin(){
  _loginPid="admin";_pinBuffer="";
  document.getElementById("loginSelectedName").textContent="Admin";
  updatePinDots();showLoginStep(2);
}

function loginAsGuest(){setSession(null,"guest","Guest");enterApp();}

function showLoginStep(n){
  document.getElementById("loginStep1").style.display=n===1?"block":"none";
  document.getElementById("loginStep2").style.display=n===2?"block":"none";
}

function loginStep1Back(){_pinBuffer="";_loginPid=null;updatePinDots();showLoginStep(1);}

function pinKey(k){
  if(k==="back"){_pinBuffer=_pinBuffer.slice(0,-1);}
  else if(_pinBuffer.length<4){_pinBuffer+=k;}
  updatePinDots();
  if(_pinBuffer.length===4)setTimeout(verifyPin,120);
}

function updatePinDots(){
  for(let i=0;i<4;i++){const d=document.getElementById("pd"+i);if(d)d.classList.toggle("filled",i<_pinBuffer.length);}
}

function verifyPin(){
  if(_loginPid==="admin"){
    if(_pinBuffer===ADMIN_PIN){setSession(null,"admin","Admin");enterApp();}else pinError();
    return;
  }
  const p=S.players.find(x=>x.id===_loginPid);
  if(!p){pinError();return;}
  if(_pinBuffer===(p.pin||"0000")){setSession(p.id,p.role||"member",p.firstName+" "+p.lastName);enterApp();}else pinError();
}

function pinError(){
  _pinBuffer="";updatePinDots();
  const dots=document.querySelector(".pin-dots");
  if(dots){dots.style.animation="none";dots.offsetHeight;dots.style.animation="pinShake .35s ease";}
}

function setSession(pid,role,name){
  SESSION={pid,role,name,loggedIn:true};
  sessionStorage.setItem("swmt_session",JSON.stringify(SESSION));
}

function enterApp(){
  document.getElementById("pageLogin").classList.remove("active");
  document.getElementById("pageMain").classList.add("active");
  const ab=document.getElementById("adminButtons");if(ab)ab.style.display=can("admin")?"flex":"none";
  updateUserBar();renderAll();
}

function logout(){
  SESSION={pid:null,role:"guest",name:"Guest",loggedIn:false};
  sessionStorage.removeItem("swmt_session");
  _pinBuffer="";_loginPid=null;updatePinDots();
  document.getElementById("pageMain").classList.remove("active");
  document.querySelectorAll(".page").forEach(p=>{if(p.id!=="pageLogin")p.classList.remove("active");});
  document.getElementById("pageLogin").classList.add("active");
  const ab=document.getElementById("adminButtons");if(ab)ab.style.display="none";
  showLoginStep(1);renderLoginMemberList();
}

function updateUserBar(){
  const name=document.getElementById("userBarName");
  const roleEl=document.getElementById("userBarRole");
  const av=document.getElementById("userBarAvatar");
  if(name)name.textContent=SESSION.name;
  if(roleEl){
    roleEl.textContent=SESSION.role==="admin"?"Admin":SESSION.role==="member"?"Member":"Guest";
    roleEl.className="role-badge "+SESSION.role;
  }
  if(av)av.innerHTML=SESSION.pid?avByName(SESSION.name,24):'<div style="width:24px;height:24px;border-radius:50%;background:var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted)">G</div>';
}

if(!load()){initPlayers();initGames();initPosts();}
// Restore or start session
(()=>{
  const saved=sessionStorage.getItem("swmt_session");
  if(saved){try{Object.assign(SESSION,JSON.parse(saved));enterApp();}catch(e){renderLoginPage();}}
  else{renderLoginPage();}
  function renderLoginPage(){
    renderLoginMemberList();
    const heroImg=document.querySelector(".hero-logo");
    const loginImg=document.getElementById("loginLogoImg");
    if(heroImg&&loginImg)loginImg.src=heroImg.src;
  }
})();

// ── GOOGLE SHEETS SYNC ──
async function syncToSheet(){
  if(!CONFIG.appsScriptUrl)return;
  try{
    await fetch(CONFIG.appsScriptUrl,{method:"POST",body:JSON.stringify({action:"save",data:S}),headers:{"Content-Type":"text/plain"}});
  }catch(e){console.warn("Sheet sync failed",e);}
}

async function loadFromSheet(){
  if(!CONFIG.appsScriptUrl)return;
  try{
    const r=await fetch(CONFIG.appsScriptUrl+"?action=load");
    if(!r.ok)return;
    const d=await r.json();
    if(d&&d.players){Object.assign(S,d);fixAll();renderAll();updateUnreadBadge();}
  }catch(e){console.warn("Sheet load failed",e);}
}

// ── SEND NOTIFICATIONS (email + SMS + push via Apps Script) ──
async function notifyAll(post){
  if(!CONFIG.appsScriptUrl)return;
  try{
    await fetch(CONFIG.appsScriptUrl,{method:"POST",body:JSON.stringify({action:"notify",post,players:S.players}),headers:{"Content-Type":"text/plain"}});
  }catch(e){console.warn("Notify failed",e);}
}

// ── APP BADGE API ──
function updateBadge(count){
  if("setAppBadge" in navigator){
    (count>0?navigator.setAppBadge(count):navigator.clearAppBadge()).catch(()=>{});
  }
}

// ── SERVICE WORKER + PUSH ──
(async()=>{
  if(!("serviceWorker" in navigator))return;
  try{
    const reg=await navigator.serviceWorker.register("sw.js");
    if("PushManager" in window&&CONFIG.oneSignalAppId===""){
      if(Notification.permission==="default"){
        const p=await Notification.requestPermission();
        if(p==="granted")console.log("Notifications enabled");
      }
    }
    // Reload in background when sheet has newer data
    if(document.visibilityState!==undefined){
      document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CONFIG.appsScriptUrl)loadFromSheet();});
    }
  }catch(e){console.warn("SW error:",e);}
})();

// ── ONESIGNAL PUSH (activated when oneSignalAppId is set) ──
if(CONFIG.oneSignalAppId){
  const s=document.createElement("script");
  s.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
  s.defer=true;
  document.head.appendChild(s);
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.init({appId:CONFIG.oneSignalAppId,welcomeNotification:{disable:false,title:"SWMT",message:"You're now subscribed to Shoe Wedge Mafia Tour notifications!"},notifyButton:{enable:true}});
  });
}

// ── PWA MANIFEST (inline) ──
(()=>{
  const icon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="24" fill="%230D0D0D"/><text y="150" x="16" font-size="145" font-family="serif">🏌️</text></svg>';
  const manifest={name:"Shoe Wedge Mafia Tour",short_name:"SWMT",description:"Golf tour score tracker & community",theme_color:"#0D0D0D",background_color:"#0D0D0D",display:"standalone",orientation:"portrait-primary",start_url:"./",icons:[{src:"data:image/svg+xml,"+icon,sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},{src:"data:image/svg+xml,"+icon,sizes:"512x512",type:"image/svg+xml"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
  const link=document.createElement("link");
  link.rel="manifest";link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

// Load latest data from sheet in background
loadFromSheet();
</script>
